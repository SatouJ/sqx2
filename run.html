<!doctype html><html><body><pre>init</pre><script>
(function(){
var q=new URLSearchParams(location.search), u=q.get('u'), b=q.get('b')||'', pad=parseInt(q.get('p')||'0');
var ps=new URLSearchParams(b);
if(pad>0){for(var i=0;i<pad;i++)ps.append('p'+i,'x');}
var f=document.createElement('form'); f.method='POST'; f.action=u;
ps.forEach(function(v,k){var i2=document.createElement('input');i2.type='hidden';i2.name=k;i2.value=v;f.appendChild(i2);});
document.querySelector('pre').textContent='POST '+u+' n='+ps.toString().length;
document.body.appendChild(f); f.submit();
})();
</script></body></html>
